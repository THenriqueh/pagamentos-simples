services:
  postgres:
    image: postgres:16-alpine
    container_name: pagamentos-postgres
    environment:
      POSTGRES_DB: pagamentos
      POSTGRES_USER: pagamentos
      POSTGRES_PASSWORD: pagamentos
    ports:
      - "5432:5432"
    volumes:
      - pagamentos-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagamentos -d pagamentos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pagamentos-data:
