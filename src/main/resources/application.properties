spring.application.name=pagamentos
server.port=8080

# ─── Banco de dados (PostgreSQL do docker-compose.yml) ───────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/pagamentos
spring.datasource.username=pagamentos
spring.datasource.password=pagamentos

# O Flyway cria as tabelas e carrega os dados iniciais (src/main/resources/db/migration).
# O Hibernate só valida se as entidades batem com as tabelas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# ─── Swagger ────────────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger
